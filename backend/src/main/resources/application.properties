# ===================================================================
# EVIDENCE BACKEND CONFIGURATION
# ===================================================================
spring.application.name=backend
server.port=${PORT:8080}
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=20
server.tomcat.max-connections=100

# -------------------------------------------------------------------
# PostgreSQL Database Configuration
# Default credentials: postgres / postgres @ localhost:5432/evidence_db
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:evidence_db}${DB_SSL_PARAM:}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:yasvanth123.}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# -------------------------------------------------------------------
# JPA & Hibernate Schema Auto-Creation & Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=false
spring.jpa.defer-datasource-initialization=true

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.example.backend=INFO

# -------------------------------------------------------------------
# Mistral AI LLM Configuration
# -------------------------------------------------------------------
mistral.ai.api-key=${MISTRAL_API_KEY:}
mistral.ai.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
mistral.ai.model=${MISTRAL_MODEL:mistral-small-latest}
mistral.ai.timeout-seconds=60

# -------------------------------------------------------------------
# JWT & OAuth Authentication Configuration
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
google.client-id=${GOOGLE_CLIENT_ID:}

