# ===================================================================
# EVIDENCE BACKEND CONFIGURATION
# ===================================================================
spring.application.name=backend
server.port=8080

# -------------------------------------------------------------------
# PostgreSQL Local Database Configuration
# Default credentials: postgres / postgres @ localhost:5432/evidence_db
# -------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:evidence_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Schema Auto-Creation & Visual Logging
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.defer-datasource-initialization=true

# -------------------------------------------------------------------
# Detailed SQL Execution Logging (Visible in Console)
# -------------------------------------------------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.example.backend=INFO

# -------------------------------------------------------------------
# Mistral AI LLM Configuration
# -------------------------------------------------------------------
mistral.ai.api-key=${MISTRAL_API_KEY:}
mistral.ai.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai/v1}
mistral.ai.model=${MISTRAL_MODEL:mistral-small-latest}
mistral.ai.timeout-seconds=60

# -------------------------------------------------------------------
# JWT & OAuth Authentication Configuration
# -------------------------------------------------------------------
