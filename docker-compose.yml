version: '3.8'

services:
  # -----------------------------------------------------------------
  # PostgreSQL Database Container
  # Accessible from host at localhost:5432
  # -----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: evidence_db
    environment:
      POSTGRES_DB: evidence_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # pgAdmin 4 - Visual Web GUI for Database Exploration
  # Open in browser: http://localhost:5050
  # Login: admin@evidence.local / admin
  # -----------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: evidence_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@evidence.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------------
  # Spring Boot Backend
  # -----------------------------------------------------------------
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidence_backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=evidence_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------------
  # React + Vite Frontend
  # -----------------------------------------------------------------
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evidence_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
